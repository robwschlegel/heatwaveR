url: https://robwschlegel.github.io/heatwaveR/

home:
  title: Detect, classify, and visualise heatwaves and cold-spells in R
  description: Fast, research-grade tools for marine and atmospheric heatwave analysis across time series and gridded workflows.
  sidebar: false

navbar:
  structure:
    left: [home, reference, articles, resources, news]
    right: [search, github, lightswitch]
  components:
    home:
      text: Overview
      href: index.html
    resources:
      text: Resources
      menu:
      - text: Marine Heatwave Tracker
        href: https://www.marineheatwaves.org/tracker.html
      - text: Interactive demo
        href: https://robert-schlegel.shinyapps.io/demoMHW/
      - text: Citations
        href: CITATIONS.html

footer:
  structure:
    left: [package, developed_by]
    right: [built_with]
  components:
    package: Research-grade tools for heatwave and cold-spell analysis in R.

reference:
- title: Detect and Classify
  desc: Core tools for building climatologies and identifying events.
  contents:
  - '`ts2clm`'
  - '`ts2clm3`'
  - '`detect_event`'
  - '`detect_event3`'
  - '`exceedance`'
  - '`category`'
- title: Summarise and Visualise
  desc: Event summaries and publication-ready plotting helpers.
  contents:
  - '`block_average`'
  - '`event_line`'
  - '`lolli_plot`'
  - '`geom_flame`'
  - '`geom_lolli`'
- title: Example Data
  desc: Observed temperature records used throughout the documentation.
  contents:
  - '`Algiers`'
  - '`sst_Med`'
  - '`sst_NW_Atl`'
  - '`sst_WA`'

articles:
- title: Get Started
  desc: Core workflows for day-to-day package use.
